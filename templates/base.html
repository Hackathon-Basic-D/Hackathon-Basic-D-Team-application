<!doctype html>
<html lang="ja">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <title>{% block title %}あやかしさんぽ{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 共通CSS・JavaScriptの読み込み-->
    <link rel="stylesheet" href="{{ static('css/base.css') }}">
    <link rel="stylesheet" href="{{ static('css/header.css') }}">
    <link rel="stylesheet" href="{{ static('css/footer.css') }}">
    <link rel="stylesheet" href="{{ static('css/button.css') }}">
    <link rel="stylesheet" href="{{ static('css/dialog.css') }}">
    
    <!-- ページ固有CSSを読み込むためのブロック -->
    {% block page_css %}{% endblock %}
</head>

<body>
    <div class="background"></div>
    {% block header%}{% endblock%}
    {% block content %}{% endblock %}
    {% block footer%}{% endblock%}
    <!-- 未ログイン時、ログインが必要な操作のタップを止めて案内を出す -->
    <script src="{{ static('js/login_hint.js') }}"></script>
    <script src="{{ static('js/toast.js') }}"></script>
    <script src="{{ static('js/confirm-dialog.js') }}"></script>
    {% if messages %}
    <script>
        {% for message in messages %}
        showToast({{ message|string|tojson }});
        {% endfor %}
    </script>
    {% endif %}
</body>
</html>
