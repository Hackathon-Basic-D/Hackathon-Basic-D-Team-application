<!doctype html>
<html lang="ja">
  <head>

</header>

<div><!-- 地図（ルート表示用） --></div>

<!-- 地図の説明文 -->
<p>地図上に選択したルートを表示しています。</p>

<!-- ルートタイトル -->
<h1>ルートタイトル</h1>

<p>ルートのサブタイトル</p>

<!-- ルート本文 -->
<p>ルート説明の本文</p>

<p>【このルートでたどる投稿】</p>
<ul>
  <!-- 1件（クリックでレポート詳細へ） -->
  <li><a href="#">投稿タイトル</a></li>
</ul>
