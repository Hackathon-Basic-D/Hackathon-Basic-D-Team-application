<!doctype html>
<html lang="ja">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <title>ルート一覧</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <!-- CSSの読み込み-->
    <link rel="stylesheet" href="/static/css/base.css">
</head>

<body>
<!-- ヘッダー -->
<header class="header">
</header>
    
<!-- ルート一覧（1件ずつ繰り返し表示される想定） -->
<ul>
  <!-- ルート1件（クリックで詳細へ 遷移先: routes:detail） -->
  <li>
    <a href="#">
      <!-- サムネイル画像（妖怪など） -->
      <img src="#" alt="ルートサムネイル">
      <!-- ルートタイトル（例：【大阪】鵺の痕跡をたどる） -->
      <span>ルートタイトル</span>
      <!-- ルート説明（例：伝説の幻獣を探して） -->
      <span>ルート説明</span>
    </a>
  </li>
</ul>

<!-- 新しいルートを作成（遷移先: routes:create ＝ route_create.html） -->
<a href="#">ルートを作成</a>

<!-- フッター -->
<footer class="footer">
    <div class="container">
        <p class="text-muted">© RareTECH Hackathon 2026 Summer D team. All rights reserved.</p>
    </div>
</footer>
</body>
</html>
