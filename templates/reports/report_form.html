<!doctype html>
<html lang="ja">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <title>レポート作成</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <!-- CSSの読み込み-->
    <link rel="stylesheet" href="/static/css/base.css">
  </head>

<body>
    <header class="header">
    </header>
    
<!-- 投稿位置を示す地図（JSで描画する要素） -->
<div><!-- 地図（投稿する位置の確認） --></div>
<!-- 投稿位置の説明文 -->
<p>この位置に投稿しようとしています</p>

<!-- 投稿フォーム -->
<form method="post">
  
<!-- 投稿タイトル -->
<p>
    <label>投稿タイトル
    <input type="text" name="report_title">
    </label>
</p>

<!-- 本文 -->
<p>
    <label>本文
    <textarea name="report_description"></textarea>
    </label>
</p>

<!-- タグ登録 -->
<p>
  <label>タグ登録
    <input type="text" name="tags">
  </label>
</p>

<!-- 画像投稿（添付ファイル） -->
<p>
    <label>画像投稿
    <input type="file" name="report_image">
    </label>
</p>
<!-- 報告する（送信）ボタン -->
<button type="submit">報告する</button>

</form>

<footer class="footer">
<div class="container">
    <p class="text-muted">© RareTECH Hackathon 2026 Summer D team. All rights reserved.</p>
</div>
</footer>

</body>
</html>
