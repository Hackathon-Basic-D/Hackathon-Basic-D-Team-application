{% extends 'base.html' %}
{% block title %}あやかしさんぽreport{% endblock %}
{% block page_css %}
  <link rel="stylesheet" href="{{ static('css/reports.css') }}">
{% endblock %}
{% block content %}
    
<!-- 投稿位置を示す地図（JSで描画する要素） -->
<div><!-- 地図（投稿する位置の確認） --></div>
<!-- 投稿位置の説明文 -->
<p>この位置に投稿しようとしています</p>

<!-- 投稿フォーム -->
<form method="post" enctype="multipart/form-data">
    {{ csrf_input }}

    <!-- 地図クリックで取得した緯度・経度（非表示で保持） -->
    {{ form.latitude }}
    {{ form.longitude }}

    <!-- 投稿タイトル -->
    <label for="report_title" class="form-label">タイトル</label>
    <input type="text" class="form-control" id="report_title" placeholder="タイトル" name="report_title">

    <!-- 本文 -->
    <label for="report_description" class="form-label">本文</label>
    <textarea class="form-control" id="report_description" placeholder="本文" style="height: 100px" name="report_description"></textarea>

    <!-- タグ登録（models.py未設定 -->
    <label for="tag" class="form-label">タグ</label>
    <input type="text" class="form-control" id="tag" placeholder="タグ" name="tag">

    <!-- 画像投稿（添付ファイル） -->
    <label for="report_image_url" class="form-label">画像投稿</label>
    <input class="form-control" type="file" id="report_image_url" name="report_image">

    <!-- 報告する（送信）ボタン -->
    <button type="submit" class="btn btn-purple mt-3">報告する</button>

</form>

{% endblock %}

{% block footer%}{% include 'footer.html' %}{% endblock%}
