<header class="header">
    <nav class="navbar navbar-expand-lg navbar-light"> 
        <button class="navbar-toggler" type="button" 
                data-toggle="collapse" 
                data-target="#navbarNavDropdown" 
                aria-controls="navbarNavDropdown" 
                aria-expanded="false" 
                aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
                  <a class="nav-link" href="{{ url('users:setting') }}">設定</a>
            </li>
            <!-- ログイン状態に応じて表示を切り替える(ログイン済みの場合)  -->
            {% if logged_in %}
            <li class="nav-item">
              <!-- バックでログアウト処理をしてログイン画面へ遷移 -->
              <!-- ログアウト処理を行うためのlogoutのURLが必要 -->
              <a class="nav-link" href="{{ url('users:logout') }}">ログアウト</a>
            </li>
            <!-- ログイン状態に応じて表示を切り替える(未ログインの場合)  -->
            {% else %}
            <li class="nav-item">
              <!-- そのままログイン画面へ遷移 -->
              <a class="nav-link" href="{{ url('users:login') }}">ログイン</a>
            </li>
            {% endif %}
          </ul>
        </div>
    </nav>
</header>
