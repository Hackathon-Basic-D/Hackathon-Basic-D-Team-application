<!-- 全ページ共通ヘッダー（ハンバーガー＋Offcanvasメニュー） -->
<header class="header">
    <!-- ハンバーガー：Offcanvasを開く -->
    <button class="hamburger" type="button"
            data-bs-toggle="offcanvas" data-bs-target="#menu-offcanvas"
            aria-label="メニューを開く">☰</button>

    <!-- オーバーレイメニュー（Bootstrap Offcanvas。膜なし・全画面はCSSで上書き） -->
    <div class="offcanvas offcanvas-end menu-offcanvas" 
        tabindex="-1" 
        id="menu-offcanvas" 
        data-bs-backdrop="false" 
        aria-labelledby="menu-title">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title menu-title" id="menu-title">メニュー</h2>
            <!-- 閉じるボタン（Bootstrapが閉じる） -->
            <button class="btn-close" type="button" data-bs-dismiss="offcanvas" aria-label="閉じる"></button>
        </div>
        <div class="offcanvas-body">
            <nav class="menu-list">
                {% if logged_in %}
                <!-- URL未登録のため仮置き # -->
                <a href="#">作成したレポート一覧</a>
                <!-- URL未登録のため仮置き # -->
                <a href="#">作成したルート一覧</a>
                {% endif %}
                <a href="{{ url('users:setting') }}">設定</a>
                {% if logged_in %}
                <a href="{{ url('users:logout') }}">ログアウト</a>
                {% else %}
                <a href="{{ url('users:login') }}">ログイン</a>
                {% endif %}
            </nav>
        </div>
    </div>
</header>
