{% extends 'base.html' %}
{% block title %}ログイン{% endblock %}

{% block page_css %}
    <link rel="stylesheet" href="{{ static('css/auth.css') }}">
    <link rel="stylesheet" href="{{ static('css/form.css') }}">
{% endblock %}

{% block content %}
<a href="{{ url('users:welcome') }}"><img class="logo" src="{{ static('image/logo.png') }}" alt="あやかしさんぽ"></a>
    <img class="catimg" src="{{ static('image/cat-b.png') }}" alt="化け猫">
<div class="row justify-content-center">
    <div class="col-md-5">
        <!--
        <h2 class="mb-4">ログイン</h2>
        -->
        <div class="content-column flush">
            <form method="post">
            {{ csrf_input }} {% if form.errors %}
            <div class="alert alert-danger">
                メールアドレスまたはパスワードが正しくありません。
            </div>
            {% endif %}

            <div class="mb-3">
                <label for="{{ form.email.id_for_label }}" class="form-label"
                >メールアドレス</label
                >
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label"
                >パスワード</label
                >
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-purple">ログイン</button>
            <a href="{{ url('users:signup') }}" class="auth-link">新規ユーザー登録はこちら</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
