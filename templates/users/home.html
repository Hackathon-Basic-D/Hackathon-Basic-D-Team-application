{% extends 'base_main.html' %}
{% block title %}あやかしさんぽhome{% endblock %}
{% block page_css %}
    <!-- CSS -->
    <link rel="stylesheet" href="{{ static('css/map.css') }}" />
    <link rel="stylesheet" href="{{ static('css/bottomsheet.css') }}" />
    <link rel="stylesheet" href="{{ static('css/home.css') }}" />

    <!-- キーだけテンプレートから渡す -->
    <script>
        window.GOOGLE_MAPS_API_KEY = "{{ GOOGLE_MAPS_API_KEY_FRONT }}";
        window.MAP_CENTER = { lat: {{ map_lat }}, lng: {{ map_lng }} };
        // views.pyが渡したJSON文字列をJSのグローバル変数として埋め込み
        // jinja2は autoescape=ONなので、事前にエスケープ済みの文字列を |safe で通す
        window.REPORTS_DATA = {{ reports_json|safe }};
    </script>

    <!-- クラスタリング用ライブラリ（home.jsより前に） -->
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>

    <!-- 共有ローダー（全ページ共通）。Google Maps APIを読み込むローダー -->
    <script src="{{ static('js/mapAPI-loader.js') }}"></script>

    <!-- そのページ固有の地図描画JS。type="module"なので他より後に実行される（ローダー準備後に動く）-->
    <script type="module" src="{{ static('js/home.js') }}"></script>
{% endblock %}

{% block content %}
<!-- レポート位置選択モードの案内（初期は非表示。JSで show クラスを付けて表示） -->
<div id="report-message">報告する場所を選択してください。</div>

<!-- 地図はこの要素の中に描画される -->
<div id="map"></div>

<!-- 現在位置取得ボタン -->
<button id="locate-btn" type="button" aria-label="現在地へ移動">
    <span id="locate-diamond">
        <img id="locate-icon" src="{{ static('image/candle-b.png') }}" alt="">
    </span>
    <span id="locate-label">現在地取得</span>
</button>

<!-- ボトムシート -->
<!-- 下から出るパネル。初期はCSSで画面外に隠している -->
<div id="bottom-sheet">
    <div id="bottom-sheet-handle"></div>
    <!-- 閉じるボタン -->
    <button id="bs-close" type="button" aria-label="閉じる">×</button>
    <!-- タイトル ＋ 詳細へのリンク（横並び） -->
    <div id="bs-header">
        <!-- タイトル -->
        <h2 id="bs-title"></h2>
        <!-- 詳細画面へ -->
        <a id="bs-detail" href="{{ url('reports:report_detail_preview') }}">【詳細を見る】</a>
    </div>
    {# <!-- タグ表示エリア（ここに #タグ を入れる置き場） --> #}
    {# <div id="bs-tags" class="bs-tags"></div> #}
    <!-- 本文 -->
    <p id="bs-desc"></p>
    <!-- 投稿者・日時（横並び。名前が長ければ折り返す） -->
    <div class="bs-meta">
        <p id="bs-author"></p>
        <p id="bs-date"></p>
    </div>
    <!-- Googleマップへ（徒歩ルート） -->
    <a class="btn-purple" id="bs-nav" href="#" target="_blank" rel="noopener">ここへ行く（Googleマップ）</a>
</div>

<!-- レポート位置選択モードでのみ使用（初期は非表示） -->
<div id="report-reticle">＋</div>
<button id="report-confirm" type="button">この位置で報告</button>

<!-- 位置選択確認メッセージ（初期は非表示。確定ボタン押下でJSが show を付ける） -->
<div id="report-check" class="card-box">
    <p class="confirm-message">ここでいいですか？</p>
    <div class="confirm-actions">
        <button id="report-check-yes" class="confirm-ok" type="button">はい</button>
        <button id="report-check-back" class="confirm-cancel" type="button">戻る</button>
    </div>
</div>
{% endblock %}
